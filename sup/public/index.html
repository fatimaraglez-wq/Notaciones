<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Conversor de Expresiones</title>

    <link rel="stylesheet" href="./css/b5.css">
    <link rel="stylesheet" href="./css/main.css">

    <script src="./js/b5.js"></script>
    <script src="./js/popper.js"></script>
</head>

<body>

    <div class="container mt-5">

        <!-- TÍTULO -->
        <div class="row justify-content-center">

            <div class="col-12 text-center mb-4">

                <h1 class="fw-bold">
                    Conversor de Expresiones
                </h1>

                <p class="text-muted">
                    Conversión entre notación infija, prefija y postfija
                </p>

            </div>

        </div>


        <!-- FORMULARIO -->
        <div class="row justify-content-center">

            <div class="col-12 col-md-8">

                <div class="card shadow-sm p-4 mb-4">

                    <div class="mb-3">

                        <label
                            for="expresion"
                            class="form-label fw-bold">

                            Ingresa una expresión:
                        </label>

                        <input
                            type="text"
                            id="expresion"
                            class="form-control form-control-lg"
                            placeholder="Ejemplo: (A + B) * (C - D)"
                            autocomplete="off">

                    </div>


                    <div class="d-grid gap-2">

                        <button
                            id="btnCalcular"
                            type="button"
                            class="btn btn-primary btn-lg fw-bold">

                            Convertir expresión

                        </button>

                    </div>


                    <div class="text-center mt-3">

                        <button
                            id="btnLimpiar"
                            type="button"
                            class="btn btn-secondary">

                            Limpiar

                        </button>

                    </div>

                </div>

            </div>

        </div>


        <!-- RESULTADO -->
        <div
            class="row justify-content-center"
            id="resultado">

        </div>

    </div>


    <script src="./js/index.js"></script>

</body>

</html>
